version: "3.9"
services:
  flow-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flow-agent
    env_file:
      - .env
    environment:
      FLOW_AGENT_CONFIG_FILE: "/app/config/prod.toml"
      FLOW_AGENT_CHANNEL_HTTP_ENABLED: "true"
      FLOW_AGENT_CHANNEL_DASHBOARD_ENABLED: "true"
      FLOW_AGENT_CHANNEL_HTTP_HOST: "0.0.0.0"
      FLOW_AGENT_CHANNEL_HTTP_PORT: "8788"
      FLOW_AGENT_CHANNEL_DASHBOARD_HOST: "0.0.0.0"
      FLOW_AGENT_CHANNEL_DASHBOARD_PORT: "8787"
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ./.flow_agent:/app/.flow_agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/snapshot', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


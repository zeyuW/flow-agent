# Flow Agent 配置文件

[llm.main]
# 主模型配置
provider = "deepseek"  # deepseek | qwen
model = "deepseek-v4-flash"
api_key = ""  # 从环境变量 $DEEPSEEK_API_KEY 读取
base_url = "https://api.deepseek.com/v1"
enable_thinking = true

[llm.fast]
# 快速模型配置（可选）
provider = "qwen"  # deepseek | qwen
model = "qwen-turbo"
api_key = ""  # 从环境变量 $QWEN_API_KEY 读取
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[embedding]
# Embedding 模型配置
provider = "qwen"  
model = "text-embedding-v3"
api_key = ""  # 从环境变量 $QWEN_API_KEY 读取
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"



[channels]
cli_enabled = true
http_enabled = false
http_host = "0.0.0.0"
http_port = 9900
dashboard_enabled = false
dashboard_host = "127.0.0.1"
dashboard_port = 9901
qq_enabled = true
qq_host = "0.0.0.0"
qq_port = 8080
qq_api_base = "http://localhost:3000"
qq_access_token = ""

[storage]
memory_db_path = ".flow/data/memory.db"

[logging]
level = "INFO"

[session]
default_session_id = "default"

[tooling]
enabled = true
max_tool_steps = 10
max_tools = 5

[retrieval]
enabled = false
max_items = 5

[observe]
enabled = false
trace_path = ".flow/logs/trace.jsonl"

[memory_policy]
enabled = true
max_messages = 100
dedupe = true

[proactive]
enabled = false
max_per_day = 10
min_interval = 300
max_interval = 3600
cooldown = 600
qq_target_user_id = ""
todo_file = ""
source_file = ""
rss_feed_files = []
web_snapshot_files = []
judge_model = ""

[drift]
enabled = false
data_dir = ".flow/data/drift"
min_interval_hours = 24
max_steps = 50

[mcp]
enabled = false
servers = []

[background]
consolidation_interval_hours = ""

[jobs]
max_async_queue = 10

[subagent]
max_concurrency = 3
tasks_file = ".flow/sessions/subagent_tasks.jsonl"

[governance]
config_version = "v1"
external_config_path = ""

[project]
name = "flow-agent"
version = "0.1.0"
description = "一个智能体"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.32.0",
    "pydantic>=2.11.10",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
flow-agent = "flow_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pyright>=1.1.408",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-agent"
version = "0.1.0"
description = "一个智能体"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.32.0",
    "pydantic>=2.11.10",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "websockets>=15.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*", "interfaces*", "infra*", "bootstrap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.pyright]
extraPaths = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pyright>=1.1.408",
]

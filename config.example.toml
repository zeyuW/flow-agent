# 主模型推介deepseek-v4-flash，其他模型推介使用阿里云，一个api使用多个模型

[llm.main]
model = "deepseek-v4-flash"
api_key = ""
base_url = "https://api.deepseek.com/v1"

# 快速判断和视觉能力使用的模型；需要时取消注释并填写对应 api_key。
# [llm.fast]
# model = "qwen-turbo"
# api_key = ""
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
#
# [llm.vision]
# model = "qwen3-vl-plus"
# api_key = ""
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[embedding]
provider = "qwen"
model = "text-embedding-v3"
api_key = ""
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 本机只读管理 API，供独立前端查询追踪状态。
[admin_api]
enabled = true
host = "127.0.0.1"
port = 8790

# 当前使用 Telegram 作为外部消息渠道。
[channels.telegram]
enabled = false
bot_token = ""
allowed_users = []
allowed_groups = []

# 主动线路默认关闭；启用时填写 Telegram 目标用户。
[proactive]
enabled = false
telegram_target_user_id = ""
max_per_day = 10
min_interval = 60
max_interval = 600
cooldown = 60
idle_enabled = false
idle_threshold_minutes = 120
interest_topics = []

# Drift 后台整理默认开启，但没有目标数据时不会主动推送。
[drift]
enabled = true
min_interval_hours = 24.0
max_steps = 50
